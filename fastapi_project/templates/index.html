<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои заметки</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding-top: 50px; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 450px; }
        h1 { text-align: center; color: #333; }
        .input-group { display: flex; margin-bottom: 20px; }
        input[type="text"] { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px 0 0 5px; outline: none; }
        button.add-btn { padding: 10px; background: #28a745; color: white; border: none; border-radius: 0 5px 5px 0; cursor: pointer; font-size: 16px; }
        button.add-btn:hover { background: #218838; }
        ul { list-style-type: none; padding: 0; }
        li { background: #e4e6eb; margin-bottom: 10px; padding: 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        button.del-btn { background: #dc3545; color: white; border: none; border-radius: 5px; padding: 5px 10px; cursor: pointer; margin-left: 10px; font-size: 14px;}
        button.del-btn:hover { background: #c82333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Мои заметки</h1>
        
        <div class="input-group">
            <input type="text" id="note-input" placeholder="Введи новую заметку...">
            <button class="add-btn" onclick="addNote()">Добавить</button>
        </div>

        <ul id="notes-list"></ul>
    </div>

    <script>
        async function loadNotes() {
            const response = await fetch('/notes');
            const notes = await response.json();
            const list = document.getElementById('notes-list');
            list.innerHTML = '';
            
            notes.forEach(note => {
                const li = document.createElement('li');
                
                // Текст заметки
                const span = document.createElement('span');
                span.textContent = note.text;
                
                // Кнопка удаления
                const btn = document.createElement('button');
                btn.textContent = 'Удалить';
                btn.className = 'del-btn';
                btn.onclick = () => deleteNote(note.id); // Передаем ID заметки
                
                li.appendChild(span);
                li.appendChild(btn);
                list.appendChild(li);
            });
        }

        async function addNote() {
            const input = document.getElementById('note-input');
            const text = input.value.trim();
            if (!text) return;

            await fetch('/notes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
            
            input.value = ''; 
            loadNotes(); 
        }

        // Функция удаления
        async function deleteNote(id) {
            await fetch('/notes/' + id, {
                method: 'DELETE'
            });
            loadNotes(); // Обновляем список после удаления
        }

        loadNotes();
    </script>
</body>
</html>
