<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои заметки</title>
    <style>
        body { font-family: sans-serif; background: #121212; display: flex; justify-content: center; padding-top: 50px; color: #e0e0e0; }
        .container { background: #1e1e1e; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 450px; }
        h1 { text-align: center; color: #ffffff; }
        .input-group { display: flex; margin-bottom: 20px; }
        input[type="text"] { flex-grow: 1; padding: 10px; background: #2c2c2c; color: white; border: 1px solid #444; border-radius: 5px 0 0 5px; outline: none; }
        input[type="text"]::placeholder { color: #888; }
        button.add-btn { padding: 10px; background: #28a745; color: white; border: none; border-radius: 0 5px 5px 0; cursor: pointer; font-size: 16px; }
        button.add-btn:hover { background: #218838; }
        ul { list-style-type: none; padding: 0; }
        li { background: #2c2c2c; margin-bottom: 10px; padding: 12px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #007bff; }
        .note-content { display: flex; flex-direction: column; }
        .note-text { font-size: 16px; margin-bottom: 5px; }
        .note-date { font-size: 12px; color: #888; }
        
        /* Стили для кнопок */
        .edit-btn { background: #ffc107; color: #000; border: none; border-radius: 5px; padding: 5px 10px; cursor: pointer; margin-right: 5px; font-size: 14px; }
        .edit-btn:hover { background: #e0a800; }
        .del-btn { background: #dc3545; color: white; border: none; border-radius: 5px; padding: 5px 10px; cursor: pointer; font-size: 14px;}
        .del-btn:hover { background: #c82333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Мои заметки</h1>
        
        <div class="input-group">
            <input type="text" id="note-input" placeholder="Введи новую заметку...">
            <button class="add-btn" onclick="addNote()">Добавить</button>
        </div>

        <ul id="notes-list"></ul>
    </div>

    <script>
        async function loadNotes() {
            const response = await fetch('/notes');
            const notes = await response.json();
            const list = document.getElementById('notes-list');
            list.innerHTML = '';
            
            notes.forEach(note => {
                const li = document.createElement('li');
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'note-content';
                
                const textSpan = document.createElement('span');
                textSpan.className = 'note-text';
                textSpan.textContent = note.text;
                
                const dateSpan = document.createElement('span');
                dateSpan.className = 'note-date';
                dateSpan.textContent = note.created_at ? 'Создано: ' + note.created_at : '';
                
                contentDiv.appendChild(textSpan);
                contentDiv.appendChild(dateSpan);
                
                // Блок с кнопками
                const btnDiv = document.createElement('div');
                
                // Кнопка редактирования
                const editBtn = document.createElement('button');
                editBtn.textContent = '✏️';
                editBtn.className = 'edit-btn';
                editBtn.onclick = () => editNote(note.id, note.text);
                
                // Кнопка удаления
                const delBtn = document.createElement('button');
                delBtn.textContent = '🗑️';
                delBtn.className = 'del-btn';
                delBtn.onclick = () => deleteNote(note.id);
                
                btnDiv.appendChild(editBtn);
                btnDiv.appendChild(delBtn);
                
                li.appendChild(contentDiv);
                li.appendChild(btnDiv);
                list.appendChild(li);
            });
        }

        async function addNote() {
            const input = document.getElementById('note-input');
            const text = input.value.trim();
            if (!text) return;

            await fetch('/notes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
            
            input.value = ''; 
            loadNotes(); 
        }

        async function editNote(id, oldText) {
            const newText = prompt("Редактировать заметку:", oldText);
            if (newText !== null && newText.trim() !== "") {
                await fetch('/notes/' + id, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: newText })
                });
                loadNotes();
            }
        }

        async function deleteNote(id) {
            await fetch('/notes/' + id, {
                method: 'DELETE'
            });
            loadNotes(); 
        }

        loadNotes();
    </script>
</body>
</html>
